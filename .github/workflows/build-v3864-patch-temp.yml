name: Temporary v3.8.64 Patch Build
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v3.8.64-sync-patch
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile patch class
        run: |
          PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p patch-build/classes patch-build/only patch-build/dex
          javac -source 8 -target 8 -cp "$PLATFORM/android.jar" -d patch-build/classes patch-src/com/parion/aidat/MainActivityV441.java patch-src/com/parion/aidat/MainActivityV442.java
          mkdir -p patch-build/only/com/parion/aidat
          cp patch-build/classes/com/parion/aidat/MainActivityV442*.class patch-build/only/com/parion/aidat/
          cd patch-build/only
          jar cf ../patch.jar com
          cd ../..
          "$BT/d8" --min-api 23 --output patch-build/dex patch-build/patch.jar
      - name: Commit dex and text chunks to patch branch
        run: |
          rm -rf patch-output
          mkdir -p patch-output/chunks
          cp patch-build/dex/classes.dex patch-output/classes.dex
          base64 -w0 patch-build/dex/classes.dex | split -b 6000 - patch-output/chunks/part-
          wc -c patch-build/dex/classes.dex > patch-output/size.txt
          sha256sum patch-build/dex/classes.dex > patch-output/sha256.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f patch-output
          git commit -m "Export v3.8.64 patch dex chunks" || exit 0
          git push origin HEAD:chatgpt/v3.8.64-sync-patch
