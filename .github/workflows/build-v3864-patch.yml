name: Build v3.8.9 Stable Patch Dex
on:
  push:
    branches: ["chatgpt/v3.8.64-sync-patch"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile stable patch class
        run: |
          PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p patch-build/classes patch-build/only patch-build/dex
          cp patch-src/com/parion/aidat/MainActivityV386Stub.java /tmp/MainActivityV386.java
          javac -source 8 -target 8 -cp "$PLATFORM/android.jar" -d patch-build/classes /tmp/MainActivityV386.java patch-src/com/parion/aidat/MainActivityV387.java
          mkdir -p patch-build/only/com/parion/aidat
          cp patch-build/classes/com/parion/aidat/MainActivityV387*.class patch-build/only/com/parion/aidat/
          cd patch-build/only
          jar cf ../patch.jar com
          cd ../..
          "$BT/d8" --min-api 23 --output patch-build/dex patch-build/patch.jar
      - uses: actions/upload-artifact@v4
        with:
          name: parion-v389-stable-patch-dex
          path: patch-build/dex/classes.dex
