name: Build Parion APK
on:
  push:
    branches: [ parion-v4-2-14-profile-photo-sync-restore ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Restore permanent Parion signing key
        env: { PARION_KEYSTORE_BASE64: '${{ secrets.PARION_KEYSTORE_BASE64 }}' }
        run: |
          test -n "$PARION_KEYSTORE_BASE64"
          printf '%s' "$PARION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parion-release.jks"
      - name: Restore official Parion logo asset
        run: |
          base64 --decode app/src/main/logo_official.b64 > app/src/main/res/drawable/parion_official_logo.png
          test -s app/src/main/res/drawable/parion_official_logo.png
      - name: Build dedicated launcher bitmap
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src=Image.open('app/src/main/res/drawable/parion_official_logo.png').convert('RGBA')
          canvas=Image.new('RGBA',(512,512),(247,178,52,255))
          logo=src.resize((348,348),Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo,((512-348)//2,(512-348)//2))
          canvas.save('app/src/main/res/drawable/parion_launcher_official.png')
          PY
      - name: Build signed release APK
        env:
          PARION_KEYSTORE_PATH: '${{ runner.temp }}/parion-release.jks'
          PARION_STORE_PASSWORD: '${{ secrets.PARION_STORE_PASSWORD }}'
          PARION_KEY_PASSWORD: '${{ secrets.PARION_KEY_PASSWORD }}'
          PARION_KEY_ALIAS: '${{ secrets.PARION_KEY_ALIAS }}'
        run: gradle assembleRelease --stacktrace
      - name: Verify v4.2.14 profile photo sync restore
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          grep -q 'MainActivityV738' app/src/main/AndroidManifest.xml
          grep -q 'MainActivityV738.class' app/src/main/java/com/parion/aidat/SplashActivity.java
          grep -q 'versionCode = 1054' app/build.gradle.kts
          grep -q 'versionName = "4.2.14"' app/build.gradle.kts
          grep -q 'scheduleLive737(4000L)' app/src/main/java/com/parion/aidat/MainActivityV737.java
          ! grep -q '@Override void syncFromCloud' app/src/main/java/com/parion/aidat/MainActivityV737.java
          grep -q 'patchVisibleProfilePhoto738' app/src/main/java/com/parion/aidat/MainActivityV738.java
          grep -q 'setAthletePhoto(target,"CLOUD:"+path)' app/src/main/java/com/parion/aidat/MainActivityV738.java
          grep -q 'parion_sync_one_athlete_lww_v411' app/src/main/java/com/parion/aidat/MainActivityV735.java
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Parion_V4_2_14_Profile_Photo_Sync_Restore.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Parion-v4.2.14-Profile-Photo-Sync-Restore
          path: Parion_V4_2_14_Profile_Photo_Sync_Restore.apk
          if-no-files-found: error
