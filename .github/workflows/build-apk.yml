name: Build Parion APK
on:
  push:
    branches: [ parion-v4-2-7-sync-controls-attendance ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Restore permanent Parion signing key
        env: { PARION_KEYSTORE_BASE64: '${{ secrets.PARION_KEYSTORE_BASE64 }}' }
        run: |
          test -n "$PARION_KEYSTORE_BASE64"
          printf '%s' "$PARION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parion-release.jks"
      - name: Restore official Parion logo asset
        run: |
          base64 --decode app/src/main/logo_official.b64 > app/src/main/res/drawable/parion_official_logo.png
          test -s app/src/main/res/drawable/parion_official_logo.png
      - name: Build dedicated launcher bitmap
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src=Image.open('app/src/main/res/drawable/parion_official_logo.png').convert('RGBA')
          canvas=Image.new('RGBA',(512,512),(247,178,52,255))
          logo=src.resize((348,348),Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo,((512-348)//2,(512-348)//2))
          canvas.save('app/src/main/res/drawable/parion_launcher_official.png')
          PY
      - name: Build signed release APK
        env:
          PARION_KEYSTORE_PATH: '${{ runner.temp }}/parion-release.jks'
          PARION_STORE_PASSWORD: '${{ secrets.PARION_STORE_PASSWORD }}'
          PARION_KEY_PASSWORD: '${{ secrets.PARION_KEY_PASSWORD }}'
          PARION_KEY_ALIAS: '${{ secrets.PARION_KEY_ALIAS }}'
        run: gradle assembleRelease --stacktrace
      - name: Verify v4.2.7 sync controls package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          grep -q 'MainActivityV731' app/src/main/AndroidManifest.xml
          grep -q 'MainActivityV731.class' app/src/main/java/com/parion/aidat/SplashActivity.java
          grep -q 'versionCode = 1047' app/build.gradle.kts
          grep -q 'versionName = "4.2.7"' app/build.gradle.kts
          grep -q 'BULUTA YÜKLE (SNAPSHOT)' app/src/main/java/com/parion/aidat/MainActivityV731.java
          grep -q 'BULUTTAN ÇEK (SNAPSHOT)' app/src/main/java/com/parion/aidat/MainActivityV731.java
          grep -q 'parion_sync_attendance_delta_v3' app/src/main/java/com/parion/aidat/MainActivityV731.java
          grep -q 'DEĞİŞİKLİKLER BULUTA KAYDEDİLSİN Mİ' app/src/main/java/com/parion/aidat/MainActivityV731.java
          grep -q 'SAFE_MULTI_DEVICE_SNAPSHOT_BLOCKED' app/src/main/java/com/parion/aidat/MainActivityV727.java
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Parion_V4_2_7_Sync_Controls_Attendance.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Parion-v4.2.7-Sync-Controls-Attendance
          path: Parion_V4_2_7_Sync_Controls_Attendance.apk
          if-no-files-found: error
