name: Build Parion APK

on:
  push:
    branches: [ main, android-v3-pilot, parion-v4-light-delta-sync, parion-v4-v62-overlay, parion-v4-0-9-profile-home-startup ]
  pull_request:
    branches: [ android-v3-pilot, parion-v4-v62-overlay ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore permanent Parion signing key
        env:
          PARION_KEYSTORE_BASE64: ${{ secrets.PARION_KEYSTORE_BASE64 }}
        run: |
          test -n "$PARION_KEYSTORE_BASE64"
          printf '%s' "$PARION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parion-release.jks"
      - name: Build signed release APK
        env:
          PARION_KEYSTORE_PATH: ${{ runner.temp }}/parion-release.jks
          PARION_STORE_PASSWORD: ${{ secrets.PARION_STORE_PASSWORD }}
          PARION_KEY_PASSWORD: ${{ secrets.PARION_KEY_PASSWORD }}
          PARION_KEY_ALIAS: ${{ secrets.PARION_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Verify v4.0.9
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q classes.dex
          grep -q 'MainActivityV609' app/src/main/AndroidManifest.xml
          grep -q 'SplashActivity' app/src/main/AndroidManifest.xml
          grep -q 'versionName = "4.0.9"' app/build.gradle.kts
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Parion_V4_0_9_Profil_Anasayfa_Acilis.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Parion-v4.0.9-Profil-Anasayfa-Acilis
          path: Parion_V4_0_9_Profil_Anasayfa_Acilis.apk
          if-no-files-found: error
