name: Build Parion APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v4.0.29 source
        uses: actions/checkout@v4
        with:
          ref: parion-v4-v62-overlay

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent Parion signing key
        env:
          PARION_KEYSTORE_BASE64: ${{ secrets.PARION_KEYSTORE_BASE64 }}
        run: |
          test -n "$PARION_KEYSTORE_BASE64"
          printf '%s' "$PARION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parion-release.jks"

      - name: Build signed release APK
        env:
          PARION_KEYSTORE_PATH: ${{ runner.temp }}/parion-release.jks
          PARION_STORE_PASSWORD: ${{ secrets.PARION_STORE_PASSWORD }}
          PARION_KEY_PASSWORD: ${{ secrets.PARION_KEY_PASSWORD }}
          PARION_KEY_ALIAS: ${{ secrets.PARION_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Verify v4.0.29 package
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q classes.dex
          grep -q 'MainActivityV629' app/src/main/AndroidManifest.xml
          grep -q 'MainActivityV629.class' app/src/main/java/com/parion/aidat/SplashActivity.java
          grep -q 'versionName = "4.0.29"' app/build.gradle.kts
          grep -q 'setMultiChoiceItems' app/src/main/java/com/parion/aidat/MainActivityV629.java
          grep -q 'showWeekdayDialog629' app/src/main/java/com/parion/aidat/MainActivityV629.java
          grep -q 'attendance_sessions' app/src/main/java/com/parion/aidat/MainActivityV628.java
          grep -q 'DEVAMSIZLAR' app/src/main/java/com/parion/aidat/MainActivityV628.java
          grep -q 'YOKLAMALARI DIŞA AKTAR' app/src/main/java/com/parion/aidat/MainActivityV628.java
          grep -q 'PAID_GREEN_625=Color.rgb(9,242,153)' app/src/main/java/com/parion/aidat/MainActivityV625.java
          grep -q 'profileSourceRoot616' app/src/main/java/com/parion/aidat/MainActivityV616.java
          grep -q 'overdueExec608' app/src/main/java/com/parion/aidat/MainActivityV608.java

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Parion_V4_0_29_Attendance_Weekday_Fix.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parion-v4.0.29-Attendance-Weekday-Fix
          path: Parion_V4_0_29_Attendance_Weekday_Fix.apk
          if-no-files-found: error
