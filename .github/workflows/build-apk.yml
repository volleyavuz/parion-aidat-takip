name: Build Parion APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v4.0.71 stabilization source
        uses: actions/checkout@v4
        with:
          ref: parion-v4-0-71-stabilization
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore permanent Parion signing key
        env:
          PARION_KEYSTORE_BASE64: ${{ secrets.PARION_KEYSTORE_BASE64 }}
        run: |
          test -n "$PARION_KEYSTORE_BASE64"
          printf '%s' "$PARION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parion-release.jks"
      - name: Build signed release APK
        env:
          PARION_KEYSTORE_PATH: ${{ runner.temp }}/parion-release.jks
          PARION_STORE_PASSWORD: ${{ secrets.PARION_STORE_PASSWORD }}
          PARION_KEY_PASSWORD: ${{ secrets.PARION_KEY_PASSWORD }}
          PARION_KEY_ALIAS: ${{ secrets.PARION_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Verify v4.0.71 package
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q classes.dex
          grep -q 'MainActivityV671' app/src/main/AndroidManifest.xml
          grep -q 'MainActivityV671.class' app/src/main/java/com/parion/aidat/SplashActivity.java
          grep -q 'versionName = "4.0.71"' app/build.gradle.kts
          grep -q 'extends MainActivityV670' app/src/main/java/com/parion/aidat/MainActivityV671.java
          grep -q 'FORM <-> PROFILE' app/src/main/java/com/parion/aidat/MainActivityV671.java
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Parion_V4_0_71_Stabilization_1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parion-v4.0.71-Stabilization-1
          path: Parion_V4_0_71_Stabilization_1.apk
          if-no-files-found: error
