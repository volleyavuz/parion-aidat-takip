name: Build Parion APK
on:
  push:
    branches: [ parion-v4-2-22-direct-sync ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Restore permanent Parion signing key
        env: { PARION_KEYSTORE_BASE64: '${{ secrets.PARION_KEYSTORE_BASE64 }}' }
        run: |
          test -n "$PARION_KEYSTORE_BASE64"
          printf '%s' "$PARION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parion-release.jks"
      - name: Restore official Parion logo asset
        run: |
          base64 --decode app/src/main/logo_official.b64 > app/src/main/res/drawable/parion_official_logo.png
          test -s app/src/main/res/drawable/parion_official_logo.png
      - name: Build dedicated launcher bitmap
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src=Image.open('app/src/main/res/drawable/parion_official_logo.png').convert('RGBA')
          canvas=Image.new('RGBA',(512,512),(247,178,52,255))
          logo=src.resize((348,348),Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo,((512-348)//2,(512-348)//2))
          canvas.save('app/src/main/res/drawable/parion_launcher_official.png')
          PY
      - name: Build signed release APK
        env:
          PARION_KEYSTORE_PATH: '${{ runner.temp }}/parion-release.jks'
          PARION_STORE_PASSWORD: '${{ secrets.PARION_STORE_PASSWORD }}'
          PARION_KEY_PASSWORD: '${{ secrets.PARION_KEY_PASSWORD }}'
          PARION_KEY_ALIAS: '${{ secrets.PARION_KEY_ALIAS }}'
        run: gradle assembleRelease --stacktrace
      - name: Verify v4.2.28 startup lifecycle reset
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          grep -q 'versionCode = 1068' app/build.gradle.kts
          grep -q 'versionName = "4.2.28"' app/build.gradle.kts
          grep -q 'MainActivityV747' app/src/main/AndroidManifest.xml
          grep -q 'MainActivityV747.class' app/src/main/java/com/parion/aidat/SplashActivity.java
          grep -q 'startupReady747=false' app/src/main/java/com/parion/aidat/MainActivityV747.java
          grep -q 'if(!startupReady747)return' app/src/main/java/com/parion/aidat/MainActivityV747.java
          grep -q 'scheduleMedia745(1800)' app/src/main/java/com/parion/aidat/MainActivityV745.java
          grep -q 'applying_remote' app/src/main/java/com/parion/aidat/MainActivityV745.java
          if grep -q 'scheduleMedia745(150)' app/src/main/java/com/parion/aidat/MainActivityV745.java; then
            echo 'early duplicate media refresh still present' >&2
            exit 1
          fi
          if grep -q 'scheduleMedia745(300)' app/src/main/java/com/parion/aidat/MainActivityV745.java; then
            echo 'resume duplicate media refresh still present' >&2
            exit 1
          fi
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Parion_V4_2_28_Single_Owner_Startup.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Parion-v4.2.28-Single-Owner-Startup
          path: Parion_V4_2_28_Single_Owner_Startup.apk
          if-no-files-found: error